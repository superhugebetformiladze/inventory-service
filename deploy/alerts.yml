# Тревоги.
#
# Их намеренно мало. Тревога, которая срабатывает раз в неделю без последствий,
# через месяц перестаёт кем-либо читаться — и вместе с ней перестают читаться
# настоящие.
groups:
  - name: inventory
    rules:
      # Очередь публикации растёт.
      #
      # Главная тревога службы: отчёты продолжают приниматься, снаружи всё
      # выглядит здоровым, а до потребителей ничего не доходит. Обнаружить это
      # иначе можно только когда кто-то заметит, что данные отстали на сутки.
      - alert: ЛентаОтстаёт
        expr: inventory_outbox_lag_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Сообщения не уходят в ленту дольше пяти минут"
          description: >
            Служба принимает отчёты, но релей не публикует их. Обычная причина —
            недоступная лента. Проверить: docker compose ps redpanda.

      # Приём отчётов прекратился.
      #
      # Пятьсот машин отчитываются круглосуточно, и полчаса полной тишины
      # означают, что сломался приём, а не что все ушли домой.
      - alert: ОтчётыНеПриходят
        expr: rate(inventory_reports_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Полчаса без единого отчёта"

      # Часть парка замолчала.
      #
      # Порог в долях, а не в штуках: пять молчащих машин из пятисот — это
      # отпуска и ремонт, пять из десяти — это сломанная раскатка.
      - alert: ПаркЗамолчал
        expr: inventory_hosts_silent / inventory_hosts_total > 0.2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Больше пятой части парка не выходит на связь"

      # Очередь разбора растёт и её не разбирают.
      - alert: ОчередьРазбораНеРазбирается
        expr: inventory_unresolved_total > 50
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "Больше пятидесяти машин сутки ждут разбора человеком"
