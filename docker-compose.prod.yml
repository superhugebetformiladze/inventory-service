# Продакшен-оверрайд: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Отличия от базового файла:
#   - порт API наружу не публикуется (доступ только через nginx внутри сети compose);
#   - Swagger выключен;
#   - nginx слушает 80 и 443, конфиг и сертификаты подключаются с хоста;
#   - контейнеры поднимаются автоматически после перезагрузки сервера;
#   - в БД и приложении включено ограничение на объём логов.

services:
  db:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: always
    environment:
      ENABLE_DOCS: "false"
    # Порт API наружу не выставляем: фронт ходит к нему внутри сети compose.
    ports: !override []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Конфиг с HTTPS и редиректом с http://
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      # Сертификат и ключ: deploy/certs/server.crt и deploy/certs/server.key
      - ./deploy/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
