# Продакшен-оверрайд: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Отличия от базового файла:
#   - порт API наружу не публикуется (доступ только через nginx внутри сети compose);
#   - Swagger выключен;
#   - nginx слушает порты из HTTP_PORT и HTTPS_PORT, конфиг и сертификаты с хоста;
#   - контейнеры поднимаются автоматически после перезагрузки сервера;
#   - в БД и приложении включено ограничение на объём логов.

services:
  db:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: always
    environment:
      ENABLE_DOCS: "false"
    # Порт API наружу не выставляем: фронт ходит к нему внутри сети compose.
    ports: !override []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    ports: !override
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
    environment:
      # Порт, на котором HTTPS виден снаружи: нужен nginx для редиректа с http://
      XMLP_HTTPS_PORT: ${HTTPS_PORT:-9443}
      # Подставлять только наши переменные, не трогая $host и прочие переменные nginx
      NGINX_ENVSUBST_FILTER: "^XMLP_"
    volumes:
      # Конфиг с HTTPS и редиректом с http://. Подключается шаблоном: при старте
      # контейнера nginx подставит в него XMLP_HTTPS_PORT и положит в conf.d/default.conf.
      - ./deploy/nginx-tls.conf:/etc/nginx/templates/default.conf.template:ro
      # Сертификат и ключ: deploy/certs/server.crt и deploy/certs/server.key
      - ./deploy/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
